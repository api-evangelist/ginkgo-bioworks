aid: ginkgo-bioworks
name: Ginkgo Bioworks
description: >-
  Ginkgo Bioworks is a synthetic biology company founded in 2008 and
  headquartered in Boston, Massachusetts, that builds a horizontal platform for
  programming biology. Through autonomous laboratories, foundry services, and
  AI-powered tools, Ginkgo automates the design-build-test cycle of biological
  engineering for customers across biopharma, agriculture, industrial biotech,
  and biosecurity. Its offerings include Build-Your-Own-Lab automation hardware
  and software, a remotely accessible Cloud Lab, Ginkgo Datapoints screening and
  data services, Foundry cell-engineering services, and the Catalyst autonomous
  lab agent. Ginkgo Bioworks (NYSE: DNA) does not currently publish a public
  self-service developer API; this profile tracks the company's identity and web
  properties in the API Evangelist network.
